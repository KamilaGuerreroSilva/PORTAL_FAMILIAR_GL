<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Hogar: Tareas, Despensa y Proyectos | Portal Familia GL &lt;3</title>
  
  <meta name="theme-color" content="#2EC4B6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Familia GL <3" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%232EC4B6'/%3E%3Ctext x='50%25' y='44%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='190' fill='%23FFFFFF'%3EGL%3C/text%3E%3Ctext x='50%25' y='74%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='110' fill='%23FFE5E4'%3E%E2%9D%A4%3C/text%3E%3C/svg%3E" />
  <style>
    button, a, input, select, textarea, label { touch-action: manipulation; }
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
    }
    .tab-active { background-color: #2EC4B6 !important; color: #FFFFFF !important; border-color: #2EC4B6 !important; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2FBFB] text-[#134E53] min-h-screen pb-24">
  <header class="bg-gradient-to-r from-[#CBF3F0] via-[#D8F3DC] to-[#EDE2F5] border-b border-[#BCECE7] px-4 sm:px-6 py-4">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <a href="../index.html" class="text-xs font-extrabold text-[#1B8A82] hover:underline">← Volver al Portal Familia GL &lt;3</a>
        <h1 class="text-lg sm:text-2xl font-black mt-0.5">Gestión del Hogar GL 🏡</h1>
        <p class="text-xs text-[#2C686E]">Reparto de tareas Kamila &amp; Isidora, semáforo de pañales/despensa/botiquín y mejoras de casa</p>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="openSubTab('tab-tar')" id="btn-tab-tar" class="sub-tab-btn tab-active px-3 py-2 rounded-xl bg-white border border-[#99E2DC] text-xs font-extrabold">✅ Tareas Semanales</button>
        <button onclick="openSubTab('tab-inv')" id="btn-tab-inv" class="sub-tab-btn px-3 py-2 rounded-xl bg-white border border-[#99E2DC] text-xs font-extrabold">🥫 Despensa y Pañales</button>
        <button onclick="openSubTab('tab-pro')" id="btn-tab-pro" class="sub-tab-btn px-3 py-2 rounded-xl bg-white border border-[#99E2DC] text-xs font-extrabold">🛠️ Proyectos Casa</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3.5 sm:px-6 mt-5">
    <!-- PESTAÑA 1: TAREAS -->
    <div id="tab-tar" class="sub-panel space-y-4">
      <form onsubmit="addHomeTask(event)" class="bg-white border-2 border-[#2EC4B6] rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
        <input id="htName" required placeholder="Tarea del hogar..." class="sm:col-span-2 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
        <select id="htOwner" class="p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true"><option value="Kamila">🩵 Kamila</option><option value="Isidora">💜 Isidora</option><option value="Ambas">💞 Ambas</option></select>
        <button type="submit" class="py-2.5 rounded-xl bg-[#2EC4B6] text-white font-extrabold">+ Agregar</button>
      </form>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="homeCols"></div>
    </div>

    <!-- PESTAÑA 2: DESPENSA, BOTIQUÍN Y PAÑALES -->
    <div id="tab-inv" class="sub-panel hidden space-y-4">
      <div class="bg-white border-2 border-[#74C69D] rounded-2xl p-4 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-black">🚦 Semáforo de Stock en Casa (Toca el estado para cambiar)</h2>
          <button onclick="shareLowStockWA()" class="px-3 py-1.5 rounded-xl bg-[#25D366] text-white text-xs font-extrabold">📲 Enviar Faltantes</button>
        </div>
        <form onsubmit="addInvItem(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
          <select id="invCat" class="sm:col-span-3 p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true"><option value="👶 Pañales / Bebé">👶 Pañales / Bebé</option><option value="🩺 Botiquín">🩺 Botiquín</option><option value="🥫 Despensa">🥫 Despensa</option><option value="🧼 Limpieza">🧼 Limpieza</option></select>
          <input id="invName" required placeholder="Producto..." class="sm:col-span-5 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
          <select id="invLevel" class="sm:col-span-2 p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true"><option value="OK">🟢 Hay</option><option value="Poco">🟡 Poco</option><option value="Agotado">🔴 Agotado</option></select>
          <button type="submit" class="sm:col-span-2 py-2.5 rounded-xl bg-[#2EC4B6] text-white font-extrabold">+ Agregar</button>
        </form>
      </div>
      <div id="invGrid" class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs"></div>
    </div>

    <!-- PESTAÑA 3: PROYECTOS CASA -->
    <div id="tab-pro" class="sub-panel hidden space-y-4">
      <form onsubmit="addProject(event)" class="bg-white border-2 border-[#CDB4DB] rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
        <input id="pjTitle" required placeholder="Proyecto o arreglo de la casa..." class="sm:col-span-6 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
        <input id="pjBudget" type="number" placeholder="Presupuesto CLP" class="sm:col-span-3 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
        <button type="submit" class="sm:col-span-3 py-2.5 rounded-xl bg-[#9D79BC] text-white font-extrabold">+ Nuevo Proyecto</button>
      </form>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="projectsCols"></div>
    </div>
  </main>

  
<script>
function openSubTab(tabId) {
  document.querySelectorAll('.sub-panel').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('tab-active'));
  const panel = document.getElementById(tabId);
  if (panel) panel.classList.remove('hidden');
  const btn = document.getElementById('btn-' + tabId);
  if (btn) btn.classList.add('tab-active');
}
</script>

  <script>
    let homeTasks = JSON.parse(localStorage.getItem('familiaGL_home_tasks')) || [
      { id: 1, title: 'Revisar mochilas jardín Clemente y Julián', owner: 'Kamila', done: false },
      { id: 2, title: 'Pedido supermercado y frutas semana', owner: 'Isidora', done: false }
    ];
    let homeInv = JSON.parse(localStorage.getItem('familiaGL_home_stock')) || [
      { id: 1, cat: '👶 Pañales / Bebé', name: 'Pañales Julián XG + Toallitas', level: 'Poco' },
      { id: 2, cat: '🩺 Botiquín', name: 'Paracetamol infantil + Suero fisiológico', level: 'OK' }
    ];
    let projects = JSON.parse(localStorage.getItem('familiaGL_home_projects')) || [
      { id: 1, title: 'Organizador Montessori juguetes pieza niños', budget: 75000, stage: 'Por Hacer' }
    ];
    const fmtCLP = n => '$' + Math.round(n || 0).toLocaleString('es-CL');

    window.getModuleCustomState = () => ({ homeTasks, homeInv, projects });
    window.setModuleCustomState = (c) => {
      if (c.homeTasks) homeTasks = c.homeTasks;
      if (c.homeInv) homeInv = c.homeInv;
      if (c.projects) projects = c.projects;
      localStorage.setItem('familiaGL_home_tasks', JSON.stringify(homeTasks));
      localStorage.setItem('familiaGL_home_stock', JSON.stringify(homeInv));
      localStorage.setItem('familiaGL_home_projects', JSON.stringify(projects));
    };
    window.getModuleDailySummary = () => `Tareas: ${homeTasks.filter(t => t.done).length}/${homeTasks.length} • Reposición: ${homeInv.filter(i => i.level !== 'OK').length} items`;
    window.onModuleStateRestored = () => { renderHome(); renderInv(); renderProjects(); };

    function addHomeTask(e) { e.preventDefault(); homeTasks.unshift({ id: Date.now(), title: document.getElementById('htName').value.trim(), owner: document.getElementById('htOwner').value, done: false }); localStorage.setItem('familiaGL_home_tasks', JSON.stringify(homeTasks)); e.target.reset(); renderHome(); }
    function toggleHome(id) { const t = homeTasks.find(x => x.id === id); if (t) t.done = !t.done; localStorage.setItem('familiaGL_home_tasks', JSON.stringify(homeTasks)); renderHome(); }
    function delHome(id) { homeTasks = homeTasks.filter(x => x.id !== id); localStorage.setItem('familiaGL_home_tasks', JSON.stringify(homeTasks)); renderHome(); }
    function renderHome() {
      document.getElementById('homeCols').innerHTML = [{k:'Kamila',t:'🩵 Kamila',b:'#2EC4B6'},{k:'Isidora',t:'💜 Isidora',b:'#CDB4DB'},{k:'Ambas',t:'💞 Ambas',b:'#FF9F9B'}].map(g => `<div class="bg-white rounded-2xl p-4 border-2" style="border-color:${g.b}"><h3 class="font-black text-sm mb-2">${g.t}</h3><div class="space-y-2 text-xs">${homeTasks.filter(t => t.owner === g.k).map(t => `<div class="p-2.5 rounded-xl border border-[#E0F8F6] flex justify-between ${t.done ? 'opacity-60 line-through' : ''}"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleHome(${t.id})" data-no-save="true"/><span>${t.title}</span></label><button onclick="delHome(${t.id})" class="text-[#C94A4A] font-bold">✕</button></div>`).join('')}</div></div>`).join('');
    }

    function addInvItem(e) { e.preventDefault(); homeInv.unshift({ id: Date.now(), cat: document.getElementById('invCat').value, name: document.getElementById('invName').value.trim(), level: document.getElementById('invLevel').value }); localStorage.setItem('familiaGL_home_stock', JSON.stringify(homeInv)); e.target.reset(); renderInv(); }
    function cycleLevel(id) { const i = homeInv.find(x => x.id === id); const o = ['OK', 'Poco', 'Agotado']; i.level = o[(o.indexOf(i.level) + 1) % 3]; localStorage.setItem('familiaGL_home_stock', JSON.stringify(homeInv)); renderInv(); }
    function delInv(id) { homeInv = homeInv.filter(x => x.id !== id); localStorage.setItem('familiaGL_home_stock', JSON.stringify(homeInv)); renderInv(); }
    function renderInv() {
      const m = { OK: ['🟢 Hay', '#E8FBF9', '#2EC4B6'], Poco: ['🟡 Poco', '#FFF9E6', '#FFBF69'], Agotado: ['🔴 Agotado', '#FFF0EF', '#FF9F9B'] };
      document.getElementById('invGrid').innerHTML = homeInv.map(i => { const s = m[i.level] || m.OK; return `<div class="p-3 rounded-2xl border-2 flex justify-between items-center" style="background:${s[1]};border-color:${s[2]}"><div><span class="text-[10px] font-bold block">${i.cat}</span><strong>${i.name}</strong></div><div class="flex gap-1"><button onclick="cycleLevel(${i.id})" class="px-2 py-1 rounded-lg bg-white font-extrabold text-[11px]">${s[0]}</button><button onclick="delInv(${i.id})" class="text-[#C94A4A] font-bold">✕</button></div></div>`; }).join('');
    }
    function shareLowStockWA() { const l = homeInv.filter(i => i.level !== 'OK').map(i => `• [${i.level}] ${i.name}`).join('\n'); window.open(`https://wa.me/?text=${encodeURIComponent('🏠 *Reposición Casa — Familia GL <3*\n\n' + (l || 'Todo OK'))}`, '_blank'); }

    function addProject(e) { e.preventDefault(); projects.unshift({ id: Date.now(), title: document.getElementById('pjTitle').value.trim(), budget: parseFloat(document.getElementById('pjBudget').value) || 0, stage: 'Por Hacer' }); localStorage.setItem('familiaGL_home_projects', JSON.stringify(projects)); e.target.reset(); renderProjects(); }
    function advanceProject(id) { const p = projects.find(x => x.id === id); const s = ['Por Hacer', 'En Proceso', 'Listo']; p.stage = s[(s.indexOf(p.stage) + 1) % 3]; localStorage.setItem('familiaGL_home_projects', JSON.stringify(projects)); renderProjects(); }
    function delProject(id) { projects = projects.filter(x => x.id !== id); localStorage.setItem('familiaGL_home_projects', JSON.stringify(projects)); renderProjects(); }
    function renderProjects() {
      document.getElementById('projectsCols').innerHTML = ['Por Hacer', 'En Proceso', 'Listo'].map(st => `<div class="bg-white rounded-2xl p-4 border-2 border-[#BCECE7]"><h3 class="font-black text-xs mb-2">${st}</h3><div class="space-y-2 text-xs">${projects.filter(p => p.stage === st).map(p => `<div class="p-2.5 rounded-xl bg-[#FAFEFE] border border-[#E0F8F6] space-y-1"><div class="flex justify-between"><strong>${p.title}</strong><button onclick="delProject(${p.id})" class="text-[#C94A4A] font-bold">✕</button></div><div class="flex justify-between items-center"><span class="text-[11px] text-[#52797E]">${fmtCLP(p.budget)}</span><button onclick="advanceProject(${p.id})" class="px-2 py-0.5 rounded bg-[#CBF3F0] font-bold text-[10px]">Avanzar ➔</button></div></div>`).join('')}</div></div>`).join('');
    }
    renderHome(); renderInv(); renderProjects();
  </script>

<!-- SISTEMA DE PERSISTENCIA PERMANENTE + HISTÓRICO DIARIO POR MÓDULO + MODO CELULAR -->
<script>
(function() {
  if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
    const swPath = window.location.pathname.includes('/modulos/') ? '../sw.js' : './sw.js';
    navigator.serviceWorker.register(swPath).catch(() => {});
  }

  const MODULE_FILE = window.location.pathname.split('/').pop() || 'index.html';
  const MODULE_ID = MODULE_FILE.replace('.html', '');
  const MODULE_NAMES = {
    'index': 'Portal Principal GL <3',
    'calendario_coparentalidad': 'Calendario 2026-2027 & Coparentalidad',
    'rutinas_sueno': 'Rutinas, Sueño, Esfínteres & Mochila',
    'escolaridad_ropa_regalos': 'Escolaridad, Ropa & Cumpleaños',
    'panoramas_ninos': 'Mapa de Panoramas Kid-Friendly',
    'pareja_bienestar_capsula': 'Kamila & Isidora: Citas, Autocuidado y Cápsula',
    'album_hitos': 'Diario de Hitos y Anécdotas GL <3',
    'finanzas_hogar': 'Finanzas: Cuentas Fijas y Plan de Ahorro',
    'gestion_hogar': 'Hogar: Tareas, Despensa y Proyectos',
    'documentos_auto': 'Bóveda de Documentos y Vehículo Familiar',
    'salud_menu_emergencia': 'Salud, Tallas, Menú y Emergencias'
  };
  const MODULE_TITLE = MODULE_NAMES[MODULE_ID] || document.title || MODULE_ID;
  const STATE_KEY = 'familiaGL_state_' + MODULE_ID;
  const HISTORY_KEY = 'familiaGL_daily_history_' + MODULE_ID;

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatDateCL(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function getFields() {
    return Array.from(document.querySelectorAll('input[id], select[id], textarea[id]')).filter(el => {
      const type = (el.type || '').toLowerCase();
      return type !== 'file' && type !== 'password' && type !== 'hidden' && !el.readOnly && !el.dataset.noSave;
    });
  }

  function collectCurrentData() {
    const fields = {};
    getFields().forEach(el => {
      if (el.type === 'checkbox' || el.type === 'radio') {
        fields[el.id] = el.checked;
      } else {
        fields[el.id] = el.value;
      }
    });
    const custom = (typeof window.getModuleCustomState === 'function') ? window.getModuleCustomState() : null;
    const summary = (typeof window.getModuleDailySummary === 'function') ? window.getModuleDailySummary() : 'Actualización registrada';
    return { fields, custom, summary };
  }

  function saveAll(manualNote) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const isoDay = todayISO();
    const payload = collectCurrentData();

    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        updatedAt: now.toISOString(),
        date: isoDay,
        fields: payload.fields,
        custom: payload.custom
      }));

      const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
      const existing = hist[isoDay] || {};
      const snapSummary = manualNote || payload.summary;

      hist[isoDay] = {
        date: isoDay,
        lastTime: timeStr,
        updatedAt: now.toISOString(),
        summary: snapSummary,
        fields: payload.fields,
        custom: payload.custom,
        count: (existing.count || 0) + 1
      };
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));

      const badge = document.getElementById('glSaveBadge');
      if (badge) {
        badge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#2EC4B6;margin-right:6px;"></span>Guardado ${timeStr} • ${formatDateCL(isoDay)}`;
      }
      renderHistoryModalList();
    } catch (e) {
      console.warn('Error guardando datos locales:', e);
    }
  }

  function applyStateObject(stateObj) {
    if (!stateObj) return;
    const fields = getFields();
    if (stateObj.fields) {
      fields.forEach(el => {
        if (Object.prototype.hasOwnProperty.call(stateObj.fields, el.id)) {
          if (el.type === 'checkbox' || el.type === 'radio') {
            el.checked = Boolean(stateObj.fields[el.id]);
          } else {
            el.value = stateObj.fields[el.id];
          }
        }
      });
    }
    if (stateObj.custom && typeof window.setModuleCustomState === 'function') {
      window.setModuleCustomState(stateObj.custom);
    }
    fields.forEach(el => {
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    });
    if (typeof window.onModuleStateRestored === 'function') {
      window.onModuleStateRestored();
    }
  }

  function restorePermanentState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      applyStateObject(parsed);
    } catch (e) {}
  }

  window.familiaGLSaveNow = function(note) {
    saveAll(note);
  };

  window.familiaGLRestoreDay = function(isoDay) {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!hist[isoDay]) return;
    if (confirm(`¿Cargar en pantalla el registro guardado del día ${formatDateCL(isoDay)}?`)) {
      applyStateObject(hist[isoDay]);
      saveAll(`Restaurado desde histórico del ${formatDateCL(isoDay)}`);
      document.getElementById('glHistoryModal').style.display = 'none';
    }
  };

  window.familiaGLDeleteDay = function(isoDay) {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    delete hist[isoDay];
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistoryModalList();
  };

  function renderHistoryModalList() {
    const container = document.getElementById('glHistoryList');
    if (!container) return;
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    const days = Object.keys(hist).sort().reverse();
    if (days.length === 0) {
      container.innerHTML = `<div style="padding:24px;text-align:center;color:#52797E;font-size:13px;">Aún no hay días registrados en el histórico de esta herramienta. Cada cambio se guarda automáticamente por fecha.</div>`;
      return;
    }
    container.innerHTML = days.map(day => {
      const item = hist[day];
      const isToday = day === todayISO();
      return `
        <div style="background:#F2FBFB;border:1px solid #BCECE7;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
              <span style="font-weight:800;color:#134E53;font-size:13px;">📅 ${formatDateCL(day)}</span>
              ${isToday ? '<span style="background:#2EC4B6;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;">HOY</span>' : ''}
              <span style="font-size:11px;color:#52797E;">${item.lastTime || ''} (${item.count || 1} mov.)</span>
            </div>
            <div style="font-size:12px;color:#2B5B60;line-height:1.4;">${item.summary || 'Registro guardado'}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button type="button" onclick="familiaGLRestoreDay('${day}')" style="background:#2EC4B6;color:#fff;border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;">Ver / Cargar</button>
            <button type="button" onclick="familiaGLDeleteDay('${day}')" style="background:#FFE5E5;color:#C94A4A;border:1px solid #FFC2C2;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;">Borrar</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function mountUI() {
    if (document.getElementById('glPersistBar')) return;
    const bar = document.createElement('div');
    bar.id = 'glPersistBar';
    bar.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;max-width:440px;margin-left:auto;z-index:9998;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);color:#134E53;border:1.5px solid #99E2DC;border-radius:16px;padding:8px 12px;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 10px 25px rgba(46,196,182,0.2);font-family:system-ui,-apple-system,sans-serif;';
    bar.innerHTML = `
      <span id="glSaveBadge" style="display:inline-flex;align-items:center;font-weight:700;color:#134E53;truncate;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#2EC4B6;margin-right:6px;shrink:0;"></span>Guardado • ${formatDateCL(todayISO())}
      </span>
      <button type="button" id="glOpenHistoryBtn" style="background:#CBF3F0;color:#0F5E63;border:1px solid #8CE0D8;border-radius:10px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;">
        📜 Histórico Día
      </button>
    `;
    document.body.appendChild(bar);

    const modal = document.createElement('div');
    modal.id = 'glHistoryModal';
    modal.style.cssText = 'display:none;position:fixed;inset:0;z-index:10000;background:rgba(19,78,83,0.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:12px;font-family:system-ui,-apple-system,sans-serif;';
    modal.innerHTML = `
      <div style="background:#FFFFFF;border:2px solid #99E2DC;border-radius:22px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,0.2);overflow:hidden;">
        <div style="padding:14px 18px;background:linear-gradient(135deg,#CBF3F0,#E8FBF9);border-bottom:1px solid #B2EAE4;display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div>
            <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#1B8A82;">Portal Familia GL &lt;3 • Bitácora Diaria</span>
            <h3 style="margin:2px 0 0;font-size:15px;font-weight:800;color:#134E53;">Histórico por Día — ${MODULE_TITLE}</h3>
          </div>
          <button type="button" id="glCloseHistoryBtn" style="background:#fff;border:1px solid #B2EAE4;color:#134E53;border-radius:10px;padding:6px 12px;font-weight:800;cursor:pointer;">✕</button>
        </div>
        <div id="glHistoryList" style="padding:14px 18px;overflow-y:auto;flex:1;"></div>
        <div style="padding:12px 18px;background:#F7FCFC;border-top:1px solid #D9F4F1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#52797E;flex-wrap:wrap;">
          <span>💾 Guardado en tu celular y PC</span>
          <button type="button" id="glSnapNowBtn" style="background:#2EC4B6;color:#fff;border:none;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;">+ Guardar foto de hoy</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('glOpenHistoryBtn').addEventListener('click', () => {
      renderHistoryModalList();
      modal.style.display = 'flex';
    });
    document.getElementById('glCloseHistoryBtn').addEventListener('click', () => {
      modal.style.display = 'none';
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });
    document.getElementById('glSnapNowBtn').addEventListener('click', () => {
      const note = prompt('Nota opcional para el registro de hoy:', 'Cierre del día guardado manualmente');
      if (note !== null) saveAll(note || 'Snapshot guardado manualmente');
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    mountUI();
    restorePermanentState();
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!hist[todayISO()]) {
      saveAll('Apertura y estado inicial del día');
    } else {
      renderHistoryModalList();
    }
    document.addEventListener('input', () => saveAll(), true);
    document.addEventListener('change', () => saveAll(), true);
  });
})();
</script>
</body></html>
