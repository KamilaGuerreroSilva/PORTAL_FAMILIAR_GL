<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Diario de Hitos y Recuerdos | Portal Familia GL &lt;3</title>
  
  <meta name="theme-color" content="#2EC4B6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Familia GL <3" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%232EC4B6'/%3E%3Ctext x='50%25' y='44%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='190' fill='%23FFFFFF'%3EGL%3C/text%3E%3Ctext x='50%25' y='74%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='110' fill='%23FFE5E4'%3E%E2%9D%A4%3C/text%3E%3C/svg%3E" />
  <style>
    button, a, input, select, textarea, label { touch-action: manipulation; }
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2FBFB] text-[#134E53] min-h-screen pb-24">
  <header class="bg-gradient-to-r from-[#EDE2F5] via-[#CBF3F0] to-[#FFE8E5] border-b border-[#BCECE7] px-4 sm:px-6 py-4">
    <div class="max-w-5xl mx-auto">
      <a href="../index.html" class="text-xs font-extrabold text-[#1B8A82] hover:underline">← Volver al Portal Familia GL &lt;3</a>
      <h1 class="text-lg sm:text-2xl font-black mt-0.5">Diario de Hitos, Frases &amp; Recuerdos GL &lt;3</h1>
      <p class="text-xs text-[#2C686E]">Guarda las salidas graciosas de Clemente (4), las nuevas palabras de Julián (2) y sus momentos juntos</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3.5 sm:px-6 mt-5 space-y-5">
    <form onsubmit="addMemory(event)" class="bg-white border-2 border-[#CDB4DB] rounded-2xl p-4 sm:p-5 space-y-3 text-xs shadow-sm">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <select id="memWho" class="p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true">
          <option value="👦 Clemente (4 años)">👦 Clemente (4 años)</option>
          <option value="👶 Julián (2 años)">👶 Julián (2 años)</option>
          <option value="👦👶 Clemente y Julián">👦👶 Clemente y Julián</option>
          <option value="💞 Familia GL <3">💞 Familia GL &lt;3</option>
        </select>
        <input id="memTitle" required placeholder="Título (Ej: Primera vez en bici / Frase graciosa)" class="sm:col-span-2 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
      </div>
      <textarea id="memText" rows="2" required placeholder="Escribe aquí lo que dijo o hizo hoy..." class="w-full p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true"></textarea>
      <div class="flex justify-end">
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#9D79BC] hover:bg-[#8661A8] text-white font-extrabold">✨ Guardar Recuerdo</button>
      </div>
    </form>

    <section id="memoriesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></section>
  </main>

  <script>
    let memories = JSON.parse(localStorage.getItem('familiaGL_memories')) || [
      { id: 1, date: '24/11/2026', who: '💞 Familia GL <3', title: 'Nace nuestro Portal Familia GL <3', text: 'Creamos este espacio para organizar nuestra vida juntos con Clemente y Julián.' }
    ];

    window.getModuleCustomState = () => ({ memories });
    window.setModuleCustomState = (c) => {
      if (c.memories) memories = c.memories;
      localStorage.setItem('familiaGL_memories', JSON.stringify(memories));
    };
    window.getModuleDailySummary = () => `Diario de recuerdos: ${memories.length} hitos guardados`;
    window.onModuleStateRestored = () => renderMemories();

    function addMemory(e) {
      e.preventDefault();
      memories.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString('es-CL'),
        who: document.getElementById('memWho').value,
        title: document.getElementById('memTitle').value.trim(),
        text: document.getElementById('memText').value.trim()
      });
      localStorage.setItem('familiaGL_memories', JSON.stringify(memories));
      if (window.familiaGLSaveNow) window.familiaGLSaveNow('Nuevo recuerdo guardado');
      e.target.reset();
      renderMemories();
    }

    function delMemory(id) {
      if (!confirm('¿Borrar este recuerdo?')) return;
      memories = memories.filter(m => m.id !== id);
      localStorage.setItem('familiaGL_memories', JSON.stringify(memories));
      if (window.familiaGLSaveNow) window.familiaGLSaveNow();
      renderMemories();
    }

    function renderMemories() {
      document.getElementById('memoriesGrid').innerHTML = memories.map(m => `
        <article class="bg-white border-2 border-[#BCECE7] rounded-2xl p-4 shadow-sm space-y-2">
          <div class="flex justify-between items-center">
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-[#F3EAF9] text-[#5C3A78]">${m.who}</span>
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-bold text-[#52797E]">📅 ${m.date}</span>
              <button onclick="delMemory(${m.id})" class="text-[#C94A4A] text-xs font-bold">✕</button>
            </div>
          </div>
          <h3 class="font-black text-sm text-[#134E53]">${m.title}</h3>
          <p class="text-xs text-[#2B5B60] leading-relaxed">${m.text}</p>
        </article>
      `).join('');
    }
    renderMemories();
  </script>

<!-- SISTEMA DE PERSISTENCIA PERMANENTE + HISTÓRICO DIARIO POR MÓDULO + MODO CELULAR -->
<script>
(function() {
  if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
    const swPath = window.location.pathname.includes('/modulos/') ? '../sw.js' : './sw.js';
    navigator.serviceWorker.register(swPath).catch(() => {});
  }

  const MODULE_FILE = window.location.pathname.split('/').pop() || 'index.html';
  const MODULE_ID = MODULE_FILE.replace('.html', '');
  const MODULE_NAMES = {
    'index': 'Portal Principal GL <3',
    'calendario_visitas': 'Calendario Visitas 2026-2027 & Amor',
    'escolaridad_actividades': 'Escolaridad, Útiles y Extraprogramáticas',
    'inventario_ropa': 'Inventario de Ropa, Faltantes y Herencia',
    'rutinas_peques': 'Rutinas Clemente (4) y Julián (2) + Mochila',
    'coparentalidad_acuerdos': 'Coparentalidad: Acuerdos y Gastos Compartidos',
    'album_hitos': 'Diario de Hitos, Anécdotas y Crecimiento',
    'citas_pareja': 'Frasco de Citas Kamila & Isidora',
    'tareas_hogar': 'Organizador Hogar Kamila & Isidora',
    'ahorro_finanzas': 'Plan de Ahorro y Alcancías Familia GL',
    'cuentas_hogar': 'Presupuesto y Cuentas Fijas del Hogar',
    'documentos_familia': 'Bóveda de Documentos y Vencimientos',
    'salud_crecimiento': 'Salud, Vacunas, Controles y Tallas',
    'menu_semanal': 'Menú Semanal y Supermercado',
    'red_apoyo': 'Directorio de Emergencia y Red de Apoyo'
  };
  const MODULE_TITLE = MODULE_NAMES[MODULE_ID] || document.title || MODULE_ID;
  const STATE_KEY = 'familiaGL_state_' + MODULE_ID;
  const HISTORY_KEY = 'familiaGL_daily_history_' + MODULE_ID;

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatDateCL(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function getFields() {
    return Array.from(document.querySelectorAll('input[id], select[id], textarea[id]')).filter(el => {
      const type = (el.type || '').toLowerCase();
      return type !== 'file' && type !== 'password' && type !== 'hidden' && !el.readOnly && !el.dataset.noSave;
    });
  }

  function collectCurrentData() {
    const fields = {};
    getFields().forEach(el => {
      if (el.type === 'checkbox' || el.type === 'radio') {
        fields[el.id] = el.checked;
      } else {
        fields[el.id] = el.value;
      }
    });
    const custom = (typeof window.getModuleCustomState === 'function') ? window.getModuleCustomState() : null;
    const summary = (typeof window.getModuleDailySummary === 'function') ? window.getModuleDailySummary() : 'Actualización registrada';
    return { fields, custom, summary };
  }

  function saveAll(manualNote) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const isoDay = todayISO();
    const payload = collectCurrentData();

    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        updatedAt: now.toISOString(),
        date: isoDay,
        fields: payload.fields,
        custom: payload.custom
      }));

      const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
      const existing = hist[isoDay] || {};
      const snapSummary = manualNote || payload.summary;

      hist[isoDay] = {
        date: isoDay,
        lastTime: timeStr,
        updatedAt: now.toISOString(),
        summary: snapSummary,
        fields: payload.fields,
        custom: payload.custom,
        count: (existing.count || 0) + 1
      };
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));

      const badge = document.getElementById('glSaveBadge');
      if (badge) {
        badge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#2EC4B6;margin-right:6px;"></span>Guardado ${timeStr} • ${formatDateCL(isoDay)}`;
      }
      renderHistoryModalList();
    } catch (e) {
      console.warn('Error guardando datos locales:', e);
    }
  }

  function applyStateObject(stateObj) {
    if (!stateObj) return;
    const fields = getFields();
    if (stateObj.fields) {
      fields.forEach(el => {
        if (Object.prototype.hasOwnProperty.call(stateObj.fields, el.id)) {
          if (el.type === 'checkbox' || el.type === 'radio') {
            el.checked = Boolean(stateObj.fields[el.id]);
          } else {
            el.value = stateObj.fields[el.id];
          }
        }
      });
    }
    if (stateObj.custom && typeof window.setModuleCustomState === 'function') {
      window.setModuleCustomState(stateObj.custom);
    }
    fields.forEach(el => {
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    });
    if (typeof window.onModuleStateRestored === 'function') {
      window.onModuleStateRestored();
    }
  }

  function restorePermanentState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      applyStateObject(parsed);
    } catch (e) {}
  }

  window.familiaGLSaveNow = function(note) {
    saveAll(note);
  };

  window.familiaGLRestoreDay = function(isoDay) {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!hist[isoDay]) return;
    if (confirm(`¿Cargar en pantalla el registro guardado del día ${formatDateCL(isoDay)}?`)) {
      applyStateObject(hist[isoDay]);
      saveAll(`Restaurado desde histórico del ${formatDateCL(isoDay)}`);
      document.getElementById('glHistoryModal').style.display = 'none';
    }
  };

  window.familiaGLDeleteDay = function(isoDay) {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    delete hist[isoDay];
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistoryModalList();
  };

  function renderHistoryModalList() {
    const container = document.getElementById('glHistoryList');
    if (!container) return;
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    const days = Object.keys(hist).sort().reverse();
    if (days.length === 0) {
      container.innerHTML = `<div style="padding:24px;text-align:center;color:#52797E;font-size:13px;">Aún no hay días registrados en el histórico de esta herramienta. Cada cambio se guarda automáticamente por fecha.</div>`;
      return;
    }
    container.innerHTML = days.map(day => {
      const item = hist[day];
      const isToday = day === todayISO();
      return `
        <div style="background:#F2FBFB;border:1px solid #BCECE7;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
              <span style="font-weight:800;color:#134E53;font-size:13px;">📅 ${formatDateCL(day)}</span>
              ${isToday ? '<span style="background:#2EC4B6;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;">HOY</span>' : ''}
              <span style="font-size:11px;color:#52797E;">${item.lastTime || ''} (${item.count || 1} mov.)</span>
            </div>
            <div style="font-size:12px;color:#2B5B60;line-height:1.4;">${item.summary || 'Registro guardado'}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button type="button" onclick="familiaGLRestoreDay('${day}')" style="background:#2EC4B6;color:#fff;border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;">Ver / Cargar</button>
            <button type="button" onclick="familiaGLDeleteDay('${day}')" style="background:#FFE5E5;color:#C94A4A;border:1px solid #FFC2C2;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;">Borrar</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function mountUI() {
    if (document.getElementById('glPersistBar')) return;
    const bar = document.createElement('div');
    bar.id = 'glPersistBar';
    bar.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;max-width:440px;margin-left:auto;z-index:9998;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);color:#134E53;border:1.5px solid #99E2DC;border-radius:16px;padding:8px 12px;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 10px 25px rgba(46,196,182,0.2);font-family:system-ui,-apple-system,sans-serif;';
    bar.innerHTML = `
      <span id="glSaveBadge" style="display:inline-flex;align-items:center;font-weight:700;color:#134E53;truncate;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#2EC4B6;margin-right:6px;shrink:0;"></span>Guardado • ${formatDateCL(todayISO())}
      </span>
      <button type="button" id="glOpenHistoryBtn" style="background:#CBF3F0;color:#0F5E63;border:1px solid #8CE0D8;border-radius:10px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;">
        📜 Histórico Día
      </button>
    `;
    document.body.appendChild(bar);

    const modal = document.createElement('div');
    modal.id = 'glHistoryModal';
    modal.style.cssText = 'display:none;position:fixed;inset:0;z-index:10000;background:rgba(19,78,83,0.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:12px;font-family:system-ui,-apple-system,sans-serif;';
    modal.innerHTML = `
      <div style="background:#FFFFFF;border:2px solid #99E2DC;border-radius:22px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,0.2);overflow:hidden;">
        <div style="padding:14px 18px;background:linear-gradient(135deg,#CBF3F0,#E8FBF9);border-bottom:1px solid #B2EAE4;display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div>
            <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#1B8A82;">Portal Familia GL &lt;3 • Bitácora Diaria</span>
            <h3 style="margin:2px 0 0;font-size:15px;font-weight:800;color:#134E53;">Histórico por Día — ${MODULE_TITLE}</h3>
          </div>
          <button type="button" id="glCloseHistoryBtn" style="background:#fff;border:1px solid #B2EAE4;color:#134E53;border-radius:10px;padding:6px 12px;font-weight:800;cursor:pointer;">✕</button>
        </div>
        <div id="glHistoryList" style="padding:14px 18px;overflow-y:auto;flex:1;"></div>
        <div style="padding:12px 18px;background:#F7FCFC;border-top:1px solid #D9F4F1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#52797E;flex-wrap:wrap;">
          <span>💾 Guardado en tu celular y PC</span>
          <button type="button" id="glSnapNowBtn" style="background:#2EC4B6;color:#fff;border:none;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;">+ Guardar foto de hoy</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('glOpenHistoryBtn').addEventListener('click', () => {
      renderHistoryModalList();
      modal.style.display = 'flex';
    });
    document.getElementById('glCloseHistoryBtn').addEventListener('click', () => {
      modal.style.display = 'none';
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });
    document.getElementById('glSnapNowBtn').addEventListener('click', () => {
      const note = prompt('Nota opcional para el registro de hoy:', 'Cierre del día guardado manualmente');
      if (note !== null) saveAll(note || 'Snapshot guardado manualmente');
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    mountUI();
    restorePermanentState();
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!hist[todayISO()]) {
      saveAll('Apertura y estado inicial del día');
    } else {
      renderHistoryModalList();
    }
    document.addEventListener('input', () => saveAll(), true);
    document.addEventListener('change', () => saveAll(), true);
  });
})();
</script>
</body></html>
