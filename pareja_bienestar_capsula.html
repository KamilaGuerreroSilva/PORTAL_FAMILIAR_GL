<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Kamila &amp; Isidora: Citas, Autocuidado y Cápsula | Portal Familia GL &lt;3</title>
  
  <meta name="theme-color" content="#2EC4B6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Familia GL <3" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%232EC4B6'/%3E%3Ctext x='50%25' y='44%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='190' fill='%23FFFFFF'%3EGL%3C/text%3E%3Ctext x='50%25' y='74%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='110' fill='%23FFE5E4'%3E%E2%9D%A4%3C/text%3E%3C/svg%3E" />
  <style>
    button, a, input, select, textarea, label { touch-action: manipulation; }
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
    }
    .tab-active { background-color: #2EC4B6 !important; color: #FFFFFF !important; border-color: #2EC4B6 !important; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2FBFB] text-[#134E53] min-h-screen pb-24">
  <header class="bg-gradient-to-r from-[#FFE8E5] via-[#F3EAF9] to-[#CBF3F0] border-b border-[#BCECE7] px-4 sm:px-6 py-4">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <a href="../index.html" class="text-xs font-extrabold text-[#1B8A82] hover:underline">← Volver al Portal Familia GL &lt;3</a>
        <h1 class="text-lg sm:text-2xl font-black mt-0.5">Espacio Kamila &amp; Isidora 💞</h1>
        <p class="text-xs text-[#5C3A78]">Frasco de citas, bloques de autocuidado individual y cartas selladas para sus Aniversarios</p>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <button onclick="openSubTab('tab-cit')" id="btn-tab-cit" class="sub-tab-btn tab-active px-3 py-2 rounded-xl bg-white border border-[#99E2DC] text-xs font-extrabold">🎲 Frasco de Citas</button>
        <button onclick="openSubTab('tab-bie')" id="btn-tab-bie" class="sub-tab-btn px-3 py-2 rounded-xl bg-white border border-[#99E2DC] text-xs font-extrabold">🧘‍♀️ Tiempo Propio</button>
        <button onclick="openSubTab('tab-cap')" id="btn-tab-cap" class="sub-tab-btn px-3 py-2 rounded-xl bg-white border border-[#99E2DC] text-xs font-extrabold">💌 Cápsula Tiempo</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3.5 sm:px-6 mt-5">
    <!-- PESTAÑA 1: FRASCO DE CITAS -->
    <div id="tab-cit" class="sub-panel space-y-4">
      <section class="bg-white border-2 border-[#FF9F9B] rounded-2xl p-5 text-center space-y-3 shadow-sm">
        <span class="px-3 py-1 rounded-full bg-[#FFE5E4] text-[#8E2A25] text-xs font-extrabold">🎲 SORTEADOR DE CITAS</span>
        <h2 id="pickedDateIdea" class="text-base sm:text-xl font-black">Toca un botón para sacar una idea del frasco</h2>
        <div class="flex flex-wrap justify-center gap-2">
          <button onclick="pickRandomDate('En Casa')" class="px-4 py-2.5 rounded-xl bg-[#2EC4B6] text-white text-xs font-extrabold">🏠 Cita en Casa (Niños durmiendo)</button>
          <button onclick="pickRandomDate('Finde Libre')" class="px-4 py-2.5 rounded-xl bg-[#FF9F9B] text-white text-xs font-extrabold">🥂 Panorama Afuera (Finde libre)</button>
        </div>
      </section>
      <form onsubmit="addDateIdea(event)" class="bg-white border-2 border-[#CDB4DB] rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
        <select id="diMode" class="sm:col-span-3 p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true"><option value="En Casa">🏠 En Casa</option><option value="Finde Libre">🥂 Finde Libre</option></select>
        <input id="diText" required placeholder="Nueva idea de cita juntas..." class="sm:col-span-7 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
        <button type="submit" class="sm:col-span-2 py-2.5 rounded-xl bg-[#9D79BC] text-white font-extrabold">+ Al Frasco</button>
      </form>
      <div id="dateIdeasGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs"></div>
    </div>

    <!-- PESTAÑA 2: AUTOCUIDADO Y TIEMPO PROPIO -->
    <div id="tab-bie" class="sub-panel hidden space-y-4">
      <form onsubmit="addSelfCare(event)" class="bg-white border-2 border-[#2EC4B6] rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs">
        <select id="scWho" class="sm:col-span-3 p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true"><option value="Kamila">🩵 Kamila</option><option value="Isidora">💜 Isidora</option></select>
        <input id="scGoal" required placeholder="Bloque descanso / deporte / hora médica..." class="sm:col-span-7 p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
        <button type="submit" class="sm:col-span-2 py-2.5 rounded-xl bg-[#2EC4B6] text-white font-extrabold">+ Agendar</button>
      </form>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="selfCareCols"></div>
    </div>

    <!-- PESTAÑA 3: CÁPSULA DEL TIEMPO -->
    <div id="tab-cap" class="sub-panel hidden space-y-4">
      <form onsubmit="addCapsule(event)" class="bg-white border-2 border-[#FF9F9B] rounded-2xl p-4 space-y-2.5 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <select id="capTo" class="p-2.5 rounded-xl border border-[#BCECE7] font-bold" data-no-save="true">
            <option value="💞 Para Isidora (Aniversario 1 Abril)">💞 Para Isidora</option>
            <option value="🩵 Para Kamila">🩵 Para Kamila</option>
            <option value="👦 Para Clemente">👦 Para Clemente</option>
            <option value="👶 Para Julián">👶 Para Julián</option>
          </select>
          <input id="capOpenDate" type="date" required class="p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
          <input id="capTitle" required placeholder="Título de la carta..." class="p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true" />
        </div>
        <textarea id="capBody" rows="2" required placeholder="Escribe aquí tu carta al futuro..." class="w-full p-2.5 rounded-xl border border-[#BCECE7]" data-no-save="true"></textarea>
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#FF9F9B] text-white font-extrabold">🔒 Sellar Carta</button>
      </form>
      <div id="capsulesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs"></div>
    </div>
  </main>

  
<script>
function openSubTab(tabId) {
  document.querySelectorAll('.sub-panel').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('tab-active'));
  const panel = document.getElementById(tabId);
  if (panel) panel.classList.remove('hidden');
  const btn = document.getElementById('btn-' + tabId);
  if (btn) btn.classList.add('tab-active');
}
</script>

  <script>
    let dateIdeas = JSON.parse(localStorage.getItem('familiaGL_date_ideas')) || [
      { id: 1, mode: 'En Casa', text: 'Tablas de queso, algo rico y película sin celulares', done: false },
      { id: 2, mode: 'Finde Libre', text: 'Cena especial Cumplemes (1° cada mes) o Aniversario 1 de Abril', done: false }
    ];
    let selfCare = JSON.parse(localStorage.getItem('familiaGL_self_care')) || [
      { id: 1, who: 'Kamila', goal: 'Bloque descanso / deporte (2 hrs)', done: false },
      { id: 2, who: 'Isidora', goal: 'Tarde libre autocuidado personal (2 hrs)', done: false }
    ];
    let capsules = JSON.parse(localStorage.getItem('familiaGL_time_capsules')) || [
      { id: 1, created: '24/11/2026', openDate: '2027-04-01', to: '💞 Para Isidora', title: 'Nuestro próximo 1 de Abril', body: 'Por muchos años más construyendo esta familia hermosa juntas <3', unlocked: false }
    ];

    window.getModuleCustomState = () => ({ dateIdeas, selfCare, capsules });
    window.setModuleCustomState = (c) => {
      if (c.dateIdeas) dateIdeas = c.dateIdeas;
      if (c.selfCare) selfCare = c.selfCare;
      if (c.capsules) capsules = c.capsules;
      localStorage.setItem('familiaGL_date_ideas', JSON.stringify(dateIdeas));
      localStorage.setItem('familiaGL_self_care', JSON.stringify(selfCare));
      localStorage.setItem('familiaGL_time_capsules', JSON.stringify(capsules));
    };
    window.getModuleDailySummary = () => `Pareja GL: ${dateIdeas.length} citas • ${selfCare.length} bloques autocuidado • ${capsules.length} cartas`;
    window.onModuleStateRestored = () => { renderDateIdeas(); renderSelfCare(); renderCapsules(); };

    function pickRandomDate(mode) { const l = dateIdeas.filter(d => d.mode === mode); if (!l.length) return; document.getElementById('pickedDateIdea').textContent = '✨ ' + l[Math.floor(Math.random() * l.length)].text; }
    function addDateIdea(e) { e.preventDefault(); dateIdeas.unshift({ id: Date.now(), mode: document.getElementById('diMode').value, text: document.getElementById('diText').value.trim(), done: false }); localStorage.setItem('familiaGL_date_ideas', JSON.stringify(dateIdeas)); e.target.reset(); renderDateIdeas(); }
    function toggleIdea(id) { const x = dateIdeas.find(i => i.id === id); if (x) x.done = !x.done; localStorage.setItem('familiaGL_date_ideas', JSON.stringify(dateIdeas)); renderDateIdeas(); }
    function delIdea(id) { dateIdeas = dateIdeas.filter(i => i.id !== id); localStorage.setItem('familiaGL_date_ideas', JSON.stringify(dateIdeas)); renderDateIdeas(); }
    function renderDateIdeas() { document.getElementById('dateIdeasGrid').innerHTML = dateIdeas.map(d => `<div class="bg-white p-3 rounded-2xl border-2 ${d.done ? 'border-[#2EC4B6] opacity-60 line-through' : 'border-[#FFD6D4]'} flex justify-between items-center"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${d.done ? 'checked' : ''} onchange="toggleIdea(${d.id})" data-no-save="true"/><span><strong>[${d.mode}]</strong> ${d.text}</span></label><button onclick="delIdea(${d.id})" class="text-[#C94A4A] font-bold">✕</button></div>`).join(''); }

    function addSelfCare(e) { e.preventDefault(); selfCare.unshift({ id: Date.now(), who: document.getElementById('scWho').value, goal: document.getElementById('scGoal').value.trim(), done: false }); localStorage.setItem('familiaGL_self_care', JSON.stringify(selfCare)); e.target.reset(); renderSelfCare(); }
    function toggleSC(id) { const x = selfCare.find(i => i.id === id); if (x) x.done = !x.done; localStorage.setItem('familiaGL_self_care', JSON.stringify(selfCare)); renderSelfCare(); }
    function delSC(id) { selfCare = selfCare.filter(i => i.id !== id); localStorage.setItem('familiaGL_self_care', JSON.stringify(selfCare)); renderSelfCare(); }
    function renderSelfCare() {
      document.getElementById('selfCareCols').innerHTML = ['Kamila', 'Isidora'].map(w => `<div class="bg-white rounded-2xl p-4 border-2 ${w === 'Kamila' ? 'border-[#2EC4B6]' : 'border-[#CDB4DB]'}"><h3 class="font-black text-sm mb-2">${w === 'Kamila' ? '🩵 Kamila' : '💜 Isidora'}</h3><div class="space-y-2 text-xs">${selfCare.filter(s => s.who === w).map(s => `<div class="p-2.5 rounded-xl border border-[#E0F8F6] flex justify-between ${s.done ? 'opacity-60 line-through' : ''}"><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSC(${s.id})" data-no-save="true"/><span>${s.goal}</span></label><button onclick="delSC(${s.id})" class="text-[#C94A4A] font-bold">✕</button></div>`).join('')}</div></div>`).join('');
    }

    function addCapsule(e) { e.preventDefault(); capsules.unshift({ id: Date.now(), created: new Date().toLocaleDateString('es-CL'), openDate: document.getElementById('capOpenDate').value, to: document.getElementById('capTo').value, title: document.getElementById('capTitle').value.trim(), body: document.getElementById('capBody').value.trim(), unlocked: false }); localStorage.setItem('familiaGL_time_capsules', JSON.stringify(capsules)); e.target.reset(); renderCapsules(); }
    function toggleCapsule(id) { const c = capsules.find(x => x.id === id); if (c) c.unlocked = !c.unlocked; localStorage.setItem('familiaGL_time_capsules', JSON.stringify(capsules)); renderCapsules(); }
    function delCapsule(id) { capsules = capsules.filter(x => x.id !== id); localStorage.setItem('familiaGL_time_capsules', JSON.stringify(capsules)); renderCapsules(); }
    function renderCapsules() { document.getElementById('capsulesGrid').innerHTML = capsules.map(c => `<div class="bg-white border-2 border-[#CDB4DB] rounded-2xl p-4 space-y-2"><div class="flex justify-between"><span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-[#FFE5E4]">${c.to}</span><button onclick="delCapsule(${c.id})" class="text-[#C94A4A] font-bold">✕</button></div><h4 class="font-black text-sm">${c.title}</h4><p class="text-[11px] text-[#52797E]">Abrir el ${c.openDate.split('-').reverse().join('/')}</p>${c.unlocked ? `<div class="p-2.5 rounded-xl bg-[#FCF9FE] border border-[#EDE2F5]">${c.body}</div>` : `<div class="p-2.5 rounded-xl bg-[#F2FBFB] border border-dashed border-[#99E2DC] text-center italic">🔒 Carta sellada</div>`}<button onclick="toggleCapsule(${c.id})" class="w-full py-1.5 rounded-xl bg-[#EDE2F5] font-extrabold text-[11px]">${c.unlocked ? 'Sellar 🔒' : 'Leer 💌'}</button></div>`).join(''); }

    renderDateIdeas(); renderSelfCare(); renderCapsules();
  </script>

<!-- SISTEMA DE PERSISTENCIA PERMANENTE + HISTÓRICO DIARIO POR MÓDULO + MODO CELULAR -->
<script>
(function() {
  if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
    const swPath = window.location.pathname.includes('/modulos/') ? '../sw.js' : './sw.js';
    navigator.serviceWorker.register(swPath).catch(() => {});
  }

  const MODULE_FILE = window.location.pathname.split('/').pop() || 'index.html';
  const MODULE_ID = MODULE_FILE.replace('.html', '');
  const MODULE_NAMES = {
    'index': 'Portal Principal GL <3',
    'calendario_coparentalidad': 'Calendario 2026-2027 & Coparentalidad',
    'rutinas_sueno': 'Rutinas, Sueño, Esfínteres & Mochila',
    'escolaridad_ropa_regalos': 'Escolaridad, Ropa & Cumpleaños',
    'panoramas_ninos': 'Mapa de Panoramas Kid-Friendly',
    'pareja_bienestar_capsula': 'Kamila & Isidora: Citas, Autocuidado y Cápsula',
    'album_hitos': 'Diario de Hitos y Anécdotas GL <3',
    'finanzas_hogar': 'Finanzas: Cuentas Fijas y Plan de Ahorro',
    'gestion_hogar': 'Hogar: Tareas, Despensa y Proyectos',
    'documentos_auto': 'Bóveda de Documentos y Vehículo Familiar',
    'salud_menu_emergencia': 'Salud, Tallas, Menú y Emergencias'
  };
  const MODULE_TITLE = MODULE_NAMES[MODULE_ID] || document.title || MODULE_ID;
  const STATE_KEY = 'familiaGL_state_' + MODULE_ID;
  const HISTORY_KEY = 'familiaGL_daily_history_' + MODULE_ID;

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatDateCL(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function getFields() {
    return Array.from(document.querySelectorAll('input[id], select[id], textarea[id]')).filter(el => {
      const type = (el.type || '').toLowerCase();
      return type !== 'file' && type !== 'password' && type !== 'hidden' && !el.readOnly && !el.dataset.noSave;
    });
  }

  function collectCurrentData() {
    const fields = {};
    getFields().forEach(el => {
      if (el.type === 'checkbox' || el.type === 'radio') {
        fields[el.id] = el.checked;
      } else {
        fields[el.id] = el.value;
      }
    });
    const custom = (typeof window.getModuleCustomState === 'function') ? window.getModuleCustomState() : null;
    const summary = (typeof window.getModuleDailySummary === 'function') ? window.getModuleDailySummary() : 'Actualización registrada';
    return { fields, custom, summary };
  }

  function saveAll(manualNote) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const isoDay = todayISO();
    const payload = collectCurrentData();

    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        updatedAt: now.toISOString(),
        date: isoDay,
        fields: payload.fields,
        custom: payload.custom
      }));

      const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
      const existing = hist[isoDay] || {};
      const snapSummary = manualNote || payload.summary;

      hist[isoDay] = {
        date: isoDay,
        lastTime: timeStr,
        updatedAt: now.toISOString(),
        summary: snapSummary,
        fields: payload.fields,
        custom: payload.custom,
        count: (existing.count || 0) + 1
      };
      localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));

      const badge = document.getElementById('glSaveBadge');
      if (badge) {
        badge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#2EC4B6;margin-right:6px;"></span>Guardado ${timeStr} • ${formatDateCL(isoDay)}`;
      }
      renderHistoryModalList();
    } catch (e) {
      console.warn('Error guardando datos locales:', e);
    }
  }

  function applyStateObject(stateObj) {
    if (!stateObj) return;
    const fields = getFields();
    if (stateObj.fields) {
      fields.forEach(el => {
        if (Object.prototype.hasOwnProperty.call(stateObj.fields, el.id)) {
          if (el.type === 'checkbox' || el.type === 'radio') {
            el.checked = Boolean(stateObj.fields[el.id]);
          } else {
            el.value = stateObj.fields[el.id];
          }
        }
      });
    }
    if (stateObj.custom && typeof window.setModuleCustomState === 'function') {
      window.setModuleCustomState(stateObj.custom);
    }
    fields.forEach(el => {
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    });
    if (typeof window.onModuleStateRestored === 'function') {
      window.onModuleStateRestored();
    }
  }

  function restorePermanentState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      applyStateObject(parsed);
    } catch (e) {}
  }

  window.familiaGLSaveNow = function(note) {
    saveAll(note);
  };

  window.familiaGLRestoreDay = function(isoDay) {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!hist[isoDay]) return;
    if (confirm(`¿Cargar en pantalla el registro guardado del día ${formatDateCL(isoDay)}?`)) {
      applyStateObject(hist[isoDay]);
      saveAll(`Restaurado desde histórico del ${formatDateCL(isoDay)}`);
      document.getElementById('glHistoryModal').style.display = 'none';
    }
  };

  window.familiaGLDeleteDay = function(isoDay) {
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    delete hist[isoDay];
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistoryModalList();
  };

  function renderHistoryModalList() {
    const container = document.getElementById('glHistoryList');
    if (!container) return;
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    const days = Object.keys(hist).sort().reverse();
    if (days.length === 0) {
      container.innerHTML = `<div style="padding:24px;text-align:center;color:#52797E;font-size:13px;">Aún no hay días registrados en el histórico de esta herramienta. Cada cambio se guarda automáticamente por fecha.</div>`;
      return;
    }
    container.innerHTML = days.map(day => {
      const item = hist[day];
      const isToday = day === todayISO();
      return `
        <div style="background:#F2FBFB;border:1px solid #BCECE7;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
              <span style="font-weight:800;color:#134E53;font-size:13px;">📅 ${formatDateCL(day)}</span>
              ${isToday ? '<span style="background:#2EC4B6;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;">HOY</span>' : ''}
              <span style="font-size:11px;color:#52797E;">${item.lastTime || ''} (${item.count || 1} mov.)</span>
            </div>
            <div style="font-size:12px;color:#2B5B60;line-height:1.4;">${item.summary || 'Registro guardado'}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button type="button" onclick="familiaGLRestoreDay('${day}')" style="background:#2EC4B6;color:#fff;border:none;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;">Ver / Cargar</button>
            <button type="button" onclick="familiaGLDeleteDay('${day}')" style="background:#FFE5E5;color:#C94A4A;border:1px solid #FFC2C2;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;">Borrar</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function mountUI() {
    if (document.getElementById('glPersistBar')) return;
    const bar = document.createElement('div');
    bar.id = 'glPersistBar';
    bar.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;max-width:440px;margin-left:auto;z-index:9998;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);color:#134E53;border:1.5px solid #99E2DC;border-radius:16px;padding:8px 12px;font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 10px 25px rgba(46,196,182,0.2);font-family:system-ui,-apple-system,sans-serif;';
    bar.innerHTML = `
      <span id="glSaveBadge" style="display:inline-flex;align-items:center;font-weight:700;color:#134E53;truncate;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#2EC4B6;margin-right:6px;shrink:0;"></span>Guardado • ${formatDateCL(todayISO())}
      </span>
      <button type="button" id="glOpenHistoryBtn" style="background:#CBF3F0;color:#0F5E63;border:1px solid #8CE0D8;border-radius:10px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;">
        📜 Histórico Día
      </button>
    `;
    document.body.appendChild(bar);

    const modal = document.createElement('div');
    modal.id = 'glHistoryModal';
    modal.style.cssText = 'display:none;position:fixed;inset:0;z-index:10000;background:rgba(19,78,83,0.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:12px;font-family:system-ui,-apple-system,sans-serif;';
    modal.innerHTML = `
      <div style="background:#FFFFFF;border:2px solid #99E2DC;border-radius:22px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,0.2);overflow:hidden;">
        <div style="padding:14px 18px;background:linear-gradient(135deg,#CBF3F0,#E8FBF9);border-bottom:1px solid #B2EAE4;display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div>
            <span style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:#1B8A82;">Portal Familia GL &lt;3 • Bitácora Diaria</span>
            <h3 style="margin:2px 0 0;font-size:15px;font-weight:800;color:#134E53;">Histórico por Día — ${MODULE_TITLE}</h3>
          </div>
          <button type="button" id="glCloseHistoryBtn" style="background:#fff;border:1px solid #B2EAE4;color:#134E53;border-radius:10px;padding:6px 12px;font-weight:800;cursor:pointer;">✕</button>
        </div>
        <div id="glHistoryList" style="padding:14px 18px;overflow-y:auto;flex:1;"></div>
        <div style="padding:12px 18px;background:#F7FCFC;border-top:1px solid #D9F4F1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#52797E;flex-wrap:wrap;">
          <span>💾 Guardado en tu celular y PC</span>
          <button type="button" id="glSnapNowBtn" style="background:#2EC4B6;color:#fff;border:none;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;">+ Guardar foto de hoy</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    document.getElementById('glOpenHistoryBtn').addEventListener('click', () => {
      renderHistoryModalList();
      modal.style.display = 'flex';
    });
    document.getElementById('glCloseHistoryBtn').addEventListener('click', () => {
      modal.style.display = 'none';
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });
    document.getElementById('glSnapNowBtn').addEventListener('click', () => {
      const note = prompt('Nota opcional para el registro de hoy:', 'Cierre del día guardado manualmente');
      if (note !== null) saveAll(note || 'Snapshot guardado manualmente');
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    mountUI();
    restorePermanentState();
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    if (!hist[todayISO()]) {
      saveAll('Apertura y estado inicial del día');
    } else {
      renderHistoryModalList();
    }
    document.addEventListener('input', () => saveAll(), true);
    document.addEventListener('change', () => saveAll(), true);
  });
})();
</script>
</body></html>
